server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml audio/ogg audio/mp4;

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# vite writes hashed file names, so they can be cached for good
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}